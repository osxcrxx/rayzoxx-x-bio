<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayzoxx-X :: Hacking Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: #0F0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* Indique qu'on peut cliquer pour le plein écran */
        }

        /* Arrière-plan : défilement de lignes de code */
        #codeStream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            opacity: 0.35; /* Légèrement transparent pour laisser place au premier plan */
            pointer-events: none;
        }

        .line {
            font-size: 0.9rem;
            white-space: nowrap;
            animation: scrollUp 4s linear infinite;
        }

        @keyframes scrollUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0.2; }
        }

        /* Conteneur principal au premier plan */
        #content {
            z-index: 2;
            text-align: center;
            position: relative;
            background: rgba(0, 0, 0, 0.75);
            padding: 40px;
            border: 1px dashed #0F0;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
        }

        /* Style de la tête de mort ASCII animée */
        .skull {
            font-size: 1.5rem;
            line-height: 1.2;
            color: #0F0;
            text-shadow: 0 0 10px #0F0, 0 0 20px #0F0;
            margin-bottom: 20px;
            animation: skullPulse 1.5s infinite alternate;
        }

        @keyframes skullPulse {
            0% { transform: scale(1); text-shadow: 0 0 5px #0F0; }
            100% { transform: scale(1.05); text-shadow: 0 0 20px #0F0, 0 0 30px #0F0; }
        }

        /* Texte RAYZOXX-X en gros avec des tirets en biais */
        .pseudo {
            font-size: 4rem;
            font-weight: bold;
            color: #0F0;
            text-shadow: 0 0 15px #0F0, 0 0 30px #0F0;
            letter-spacing: 8px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            margin: 10px 0;
        }

        /* Ajout des tirets en biais décoratifs autour/dans le texte */
        .pseudo::before {
            content: "///---\\\\ ";
            font-size: 2rem;
            vertical-align: middle;
            color: #008000;
        }

        .pseudo::after {
            content: " //---///";
            font-size: 2rem;
            vertical-align: middle;
            color: #008000;
        }

        /* Instruction pour activer le plein écran */
        .click-hint {
            font-size: 0.8rem;
            color: #008000;
            margin-top: 15px;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Conteneur des lignes de code qui défilent -->
    <div id="codeStream"></div>

    <!-- Interface centrale -->
    <div id="content">
        <!-- Tête de mort ASCII en vert -->
        <div class="skull">
            &nbsp;&nbsp;_____&nbsp;&nbsp;<br>
            &nbsp/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\&nbsp;<br>
            |&nbsp;&nbsp;v&nbsp;&nbsp;&nbsp;v&nbsp;&nbsp;|<br>
            |&nbsp;&nbsp;&nbsp;&nbsp;>&nbsp;&nbsp;&nbsp;&nbsp;|<br>
            &nbsp;\&nbsp;&nbsp;---&nbsp;&nbsp;/<br>
            &nbsp;&nbsp;---V---&nbsp;
        </div>

        <!-- Pseudo principal -->
        <div class="pseudo">RAYZOXX-X</div>

        <!-- Indication de clic pour plein écran -->
        <div class="click-hint">[ CLIQUEZ N'IMPORTE OÙ POUR PASSER EN PLEIN ÉCRAN ]</div>
    </div>

    <script>
        // 1. Génération dynamique du flux de lignes de code façon hacking (comme sur votre image)
        const codeStream = document.getElementById('codeStream');
        const commands = [
            "// vmc.exe prompt command.vnc --result=001.3385k used by login administrator - 0011001111",
            "fig name(245+56*(105+884)/87)-prompt.exe src/hostname----ip=192.168.22.01 socket function logged as admin user",
            "ip192.168.84.12/user/dereference/Maps URL, and get place details (hours, reviews, locations)",
            "function/login/command/line0187778845+969/192.168.01.23 login admin result01/srvc/2kb/address.exe",
            "(portal_acces)/admin.exe_scriptlog* name/fix user/logged/administratorfromip192.168.220.01",
            "n(p*01)_prompt_script.exe http://172.44.56.91/mizuno/allacces",
            "dxdiag/socket01/http://147.23.88.03/user-admin http://147.23.88.03/user-admin //script_vrc.exe",
            "2256M used - 55%_user admin 88.23.5.11/socket01/156849843521_adsf(n)po+05 ipconfig",

            "socket//01/50^dxdiag(user2) loginfailedx status=err1 1m10//768argN"
        ];

        function createLine() {
            const line = document.createElement('div');
            line.className = 'line';
            // Choisir une ligne aléatoire dans la liste
            line.innerText = commands[Math.floor(Math.random() * commands.length)];
            // Couleur aléatoire entre vert fluo et vert sombre pour plus de réalisme
            line.style.color = Math.random() > 0.3 ? '#0F0' : '#008000';
            codeStream.appendChild(line);

            // Supprimer la ligne après qu'elle ait fini son animation pour éviter de surcharger la mémoire
            setTimeout(() => {
                line.remove();
            }, 4000);
        }

        // Créer de nouvelles lignes en continu
        setInterval(createLine, 100);

        // 2. Gestion du plein écran au premier clic (simule la touche F11)
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Erreur lors du passage en plein écran : ${err.message}`);
                });
            }
        });
    </script>
</body>
</html>
